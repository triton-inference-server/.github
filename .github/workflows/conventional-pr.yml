# Reusable workflow: validates the PR title against the Conventional Commits
# format (<type>: <Title>) and labels the PR with its commit type.
# Call from a repo with:
#
#   jobs:
#     conventional-pr:
#       uses: triton-inference-server/.github/.github/workflows/conventional-pr.yml@v1.0.0
#
# The caller must grant `permissions: pull-requests: write`.

name: conventional-pr

on:
  workflow_call:

jobs:
  validate-and-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Validate PR title and apply type label
      uses: actions/github-script@v7
      with:
        script: |
          const types = ['build', 'chore', 'ci', 'docs', 'feat', 'fix',
                         'perf', 'refactor', 'revert', 'style', 'test'];
          const title = context.payload.pull_request.title;
          const match = title.match(/^(\w+)(\([^)]*\))?!?: .+/);

          if (!match || !types.includes(match[1])) {
            core.setFailed(
              `PR title "${title}" does not follow the Conventional Commits ` +
              `format "<type>: <Title>" with type one of: ${types.join(', ')}. ` +
              'See https://www.conventionalcommits.org/');
            return;
          }
          const type = match[1];

          // Ensure the label exists, then apply it (idempotent). Remove any
          // stale type label left from a previous title.
          const { owner, repo } = context.repo;
          const number = context.payload.pull_request.number;
          try {
            await github.rest.issues.createLabel(
              { owner, repo, name: type, color: 'ededed' });
          } catch (e) {
            if (e.status !== 422) throw e;  // 422 = already exists
          }
          const { data: current } = await github.rest.issues.listLabelsOnIssue(
            { owner, repo, issue_number: number });
          for (const l of current) {
            if (types.includes(l.name) && l.name !== type) {
              await github.rest.issues.removeLabel(
                { owner, repo, issue_number: number, name: l.name });
            }
          }
          await github.rest.issues.addLabels(
            { owner, repo, issue_number: number, labels: [type] });
          core.info(`PR title OK; labeled as "${type}".`);
